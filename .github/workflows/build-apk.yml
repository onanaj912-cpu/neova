name: Build NÉOVA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.0
          channel: stable

      - name: Installer les dependances
        run: flutter pub get

      - name: Creer la cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/neova-release.jks

      - name: Construire APK signe
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/neova-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: neova-apk
          path: build/app/outputs/flutter-apk/app-release.apk
